name: SAST

on:
  pull_request:
    branches: [main]
  workflow_call: # called by cicd.yml for main and release tags

permissions:
  contents: read

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:c8f333ab0ad103d2bcd3b55cbeabcfc556bfeaa7446ba18594a4320f3807ffc9
    steps:
      - uses: actions/checkout@v7

      # Full report with every severity (INFO, WARNING, ERROR) for review.
      - name: Semgrep report (all severities)
        run: >
          semgrep scan
          --config p/python
          --metrics=off
          --json --output semgrep.json
          .

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-report
          path: semgrep.json

      # Blocking policy (docs/seguridad-hallazgos.md): Semgrep's highest severity,
      # ERROR, is the equivalent of HIGH/CRITICAL and fails the build.
      # WARNING/INFO findings stay in the report without blocking.
      - name: Fail on ERROR-severity findings
        run: >
          semgrep scan
          --config p/python
          --metrics=off
          --severity ERROR
          --error
          .
