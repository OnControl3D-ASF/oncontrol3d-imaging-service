name: Secrets

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # secrets remain recoverable from the full history

      - name: Gitleaks scan
        run: >
          docker run --rm
          --user "$(id -u):$(id -g)"
          -e HOME=/tmp
          -v "$GITHUB_WORKSPACE:/repo"
          "$GITLEAKS_IMAGE"
          git /repo --log-opts=--all --redact --no-banner
          --report-format json --report-path /repo/gitleaks.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks.json
