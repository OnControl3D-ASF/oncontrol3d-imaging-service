name: Secrets

on:
  pull_request:
    branches: [main]
  workflow_call: # called by cicd.yml for main and release tags

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb

# Rules: default gitleaks ruleset + .gitleaks.toml (Spring placeholders with
# hardcoded secret defaults, test-only key allowlist).
jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # secrets remain recoverable from the full history

      # Report only: a secret that reached git history cannot be removed without
      # rewriting it; the remediation is to ROTATE it (docs/seguridad-hallazgos.md).
      - name: Gitleaks history report (all commits)
        run: >
          docker run --rm
          --user "$(id -u):$(id -g)"
          -e HOME=/tmp
          -v "$GITHUB_WORKSPACE:/repo"
          "$GITLEAKS_IMAGE"
          git /repo --log-opts=--all --redact --no-banner
          --config /repo/.gitleaks.toml
          --exit-code 0
          --report-format json --report-path /repo/gitleaks-history.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-history.json

      # Blocking gate: any secret in the current tree fails the build.
      - name: Fail on secrets in the current tree
        run: >
          docker run --rm
          --user "$(id -u):$(id -g)"
          -e HOME=/tmp
          -v "$GITHUB_WORKSPACE:/repo:ro"
          "$GITLEAKS_IMAGE"
          dir /repo --redact --no-banner
          --config /repo/.gitleaks.toml
          --exit-code 1
