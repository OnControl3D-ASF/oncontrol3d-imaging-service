name: SCA

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1" # new vulnerabilities can appear without code changes

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # requirements*.txt pin exact versions, so no install step is needed.
      - name: Generate full report
        run: >
          docker run --rm
          -v "$GITHUB_WORKSPACE:/src"
          -v trivy-cache:/root/.cache
          -w /src
          "$TRIVY_IMAGE"
          fs . --scanners vuln --format json --output trivy.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy.json

      # Blocking policy: ANY CRITICAL blocks (fixed or not); HIGH blocks when a fix exists.
      - name: Fail on CRITICAL vulnerabilities
        run: >
          docker run --rm
          -v "$GITHUB_WORKSPACE:/src"
          -v trivy-cache:/root/.cache
          -w /src
          "$TRIVY_IMAGE"
          fs . --scanners vuln --severity CRITICAL --exit-code 1

      - name: Fail on fixable HIGH vulnerabilities
        run: >
          docker run --rm
          -v "$GITHUB_WORKSPACE:/src"
          -v trivy-cache:/root/.cache
          -w /src
          "$TRIVY_IMAGE"
          fs . --scanners vuln --severity HIGH --ignore-unfixed --exit-code 1
